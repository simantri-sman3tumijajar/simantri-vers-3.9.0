    <script>
      (function() {
        // Intercept and prevent benign unhandled rejections from Vite HMR WebSockets in iFrame proxy
        // and Firestore idle stream timeout disconnects
        function isIgnorableError(msg) {
          if (!msg) return false;
          var s = String(msg).toLowerCase();
          return (
            s.indexOf('websocket closed without opened') !== -1 ||
            s.indexOf('disconnecting idle stream') !== -1 ||
            s.indexOf('timed out waiting for new targets') !== -1 ||
            s.indexOf('grpcconnection rpc') !== -1 ||
            s.indexOf('grpcconnection') !== -1 ||
            s.indexOf('code: 1 message: 1 cancelled') !== -1 ||
            s.indexOf('quota limit exceeded') !== -1 ||
            s.indexOf('resource-exhausted') !== -1 ||
            s.indexOf('@firebase/firestore') !== -1 ||
            s.indexOf('missing or insufficient permissions') !== -1 ||
            s.indexOf('permission-denied') !== -1
          );
        }

        var origError = console.error;
        console.error = function() {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            str += (typeof arg === 'string' ? arg : (arg && arg.message ? arg.message : JSON.stringify(arg) || '')) + ' ';
          }
          if (isIgnorableError(str)) {
            return;
          }
          if (origError) {
            origError.apply(console, arguments);
          }
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = reason ? (reason.message || String(reason)) : '';
          if (isIgnorableError(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event ? (event.message || String(event.error || '')) : '';
          if (isIgnorableError(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
